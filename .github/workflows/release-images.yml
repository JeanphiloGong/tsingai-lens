name: Release Docker Images

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, user-service]
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable version
        env:
          VERSION: ${{ github.ref_name }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: jeanphilo/tsingai-lens-${{ matrix.component }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=lens-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=lens-${{ matrix.component }}
          build-args: |
            APT_MIRROR=http://deb.debian.org
            PIP_INDEX_URL=https://pypi.org/simple
            PUBLIC_API_BASE_URL=same-origin
